# ST-LINK virtual COM port, 115200 baud; USART1 is disabled in the overlay.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y

CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_CAN=y
CONFIG_CAN_MCP2515=y
CONFIG_CAN_DEFAULT_BITRATE=500000

# Application-local CMake adaptation makes both RX workers preemptive priority 0.
CONFIG_CAN_MCP2515_INT_THREAD_PRIO=0
CONFIG_CAN_MCP2515_INT_THREAD_STACK_SIZE=1024
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_STM32_ENABLE_DEBUG_SLEEP_STOP=y

CONFIG_PWM=y
CONFIG_WATCHDOG=y
CONFIG_NUM_PREEMPT_PRIORITIES=16
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_THREAD_NAME=y
