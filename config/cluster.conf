# Lab 5 cluster configuration.
#
# This file must be byte-identical on every node. The STM32 build turns it into
# a generated header (tools/gen_config.py); the Pi parses it at run time
# (pi/demo/cluster_config.py). Both compute the same hash, which every node
# prints at boot so a mismatch is visible before the demo starts.
#
# Local identity is deliberately NOT in this file. It comes from the build:
# -DLAB_NODE_ID on the STM32, --node on the Pi.

# Cluster size. A majority is N/2 + 1, so 2 of 3.
N=3

# Pre-defined leader: a node ID, or none/random to hold an election at boot.
default_leader=cockpit

# Leader heartbeat period in milliseconds. This is the REF period.
heartbeat_ms=20

# Consecutive missed REFs before a follower declares the leader dead.
missed_heartbeats=3

# Random range in milliseconds added to the election timeout.
# Election timeout = missed_heartbeats * heartbeat_ms + U(0, jitter), so 60..99 ms.
election_timeout_jitter_ms=39

# Logical log capacity. The Pi holds all of it; each STM32 keeps a smaller
# ring (LAB5_LOG_RING) because the F401RE has 96 KB of SRAM. See TASKS.md D7.
log_size=30000

# Every node ID in the cluster, in order. Index + 1 is the numeric node ID.
nodes=cockpit,steering,drivetrain

# Print election and append messages.
Debug=Yes

# Seed for the election jitter RNG, combined with the local node ID so one
# seed gives each node a different draw. Checkoff step 8 needs this settable.
election_seed=1
